<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Art</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <nav class="case-tabs" id="main-nav">
        <button id="hamburger-btn" class="hamburger-btn" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="tab-group" data-group="interactive" id="mobile-menu">
          <span class="group-label">Interactive</span>
          <div class="tab-row">
            <div class="tab" data-case="hex-maze">Hexagon Maze</div>
            <div class="tab" data-case="fibonacci-maze">Fibonacci Maze</div>
            <div class="tab" data-case="circular">Circular Obstacles</div>
            <div class="tab active" data-case="square-maze">Square Maze</div>
            <div class="tab" data-case="water-maze">Water Flow Maze</div>
            <div class="tab" id="tab-poly" data-case="polygon-maze">Polygon Maze</div>
            <div class="tab" id="tab-sphere" data-case="sphere-maze">Sphere Maze</div>
            <div class="tab" id="tab-sphere-face" data-case="sphere-face-maze">Sphere Face Maze</div>
          </div>
        </div>
      </nav>

      <header id="header">
        <h1 id="main-title">Square Grid Maze</h1>
        <p class="subtitle" id="main-subtitle">Find the shortest path in a rectangular maze.</p>
      </header>

      <main class="dashboard-card">
        <div class="canvas-container" id="capture-zone">
          <div id="formula-overlay" class="formula-overlay"></div>
          <canvas id="mathCanvas"></canvas>
        </div>

        <aside class="controls-shell">
          <section id="display-controls" class="controls" data-mode="display"></section>
          <section id="interactive-controls" class="controls active" data-mode="interactive"></section>
        </aside>
      </main>
    </div>

    <div id="sleep-overlay">
      <div class="sleep-content">
        <h2>Deep Sleep Mode</h2>
        <p>System paused due to inactivity.<br>Move mouse or click to resume.</p>
        <div class="btn-primary" onclick="Core.resetIdleTimer()">Resume Activity</div>
      </div>
    </div>

    <script src="audio.js"></script>
    <script src="core.js"></script>
    <script src="cases/maze_engine.js"></script>
    <script src="cases/hex_maze.js"></script>
    <script src="cases/fibonacci_maze.js"></script>
    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
    <script src="cases/circular_pathfinding.js"></script>
    <script src="cases/square_maze.js"></script>
    <script src="cases/polygon_maze.js"></script>
    <script src="cases/sphere_maze.js"></script>
    <script src="cases/square_water_maze.js"></script>
    <script src="cases/sphere_face_maze.js"></script>
    <script>
      const caseMap = {
        'hex-maze':        { title: 'Hexagon Maze',                sub: 'Find the shortest path in a hex grid.',                  obj: () => HexMazeCase },
        'fibonacci-maze':  { title: 'Fibonacci Hex Maze',          sub: 'Pathfinding through golden angle seeds.',                 obj: () => FibonacciMazeCase },
        'circular':        { title: 'Circular Obstacle Pathfinding',sub: 'Find a path around round obstacles.',                    obj: () => CircularPathfindingCase },
        'square-maze':     { title: 'Square Grid Maze',            sub: 'Find the shortest path in a rectangular maze.',           obj: () => SquareMazeCase },
        'water-maze':      { title: 'Water Flow Simulation',       sub: 'Gravity-driven water filling through a maze.',            obj: () => SquareWaterMazeCase },
        'polygon-maze':    { title: 'Polygonal Voronoi Maze',      sub: 'Maze solving on an irregular polygonal grid.',            obj: () => PolygonMazeCase },
        'sphere-maze':     { title: 'Spherical Voronoi Maze',      sub: 'Maze solving on a rotating 3D-projected sphere.',         obj: () => SphereMazeCase },
        'sphere-face-maze':{ title: 'Goldberg Face Maze',          sub: 'Pathfinding by traversing polyhedron faces on a sphere.', obj: () => SphereFaceMazeCase }
      };

      function loadCaseByName(name) {
        const info = caseMap[name];
        if (!info) return false;
        try {
          const caseObj = info.obj();
          if (!caseObj) return false;
          document.getElementById('main-title').textContent = info.title;
          document.getElementById('main-subtitle').textContent = info.sub;
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          const activeTab = document.querySelector(`.tab[data-case="${name}"]`);
          if (activeTab) activeTab.classList.add('active');
          Core.loadCase(caseObj, { mode: 'interactive' });
          localStorage.setItem('maze-art-case', name);
          return true;
        } catch(e) { return false; }
      }

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          loadCaseByName(tab.getAttribute('data-case'));
        });
      });

      window.onload = () => {
        const saved = localStorage.getItem('maze-art-case');
        if (!saved || !loadCaseByName(saved)) {
          loadCaseByName('square-maze');
        }
      };
    </script>
  </body>
</html>
